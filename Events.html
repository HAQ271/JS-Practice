<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <script defer src="Events.js"></script>
    <title>Day 19 Task</title>
    <style>
      body {
        font-family: "Segoe UI", Tahoma, Geneva, Verdana, sans-serif;
        background-color: #f4f7f6;
        display: flex;
        justify-content: center;
        align-items: center;
        height: 100vh;
        margin: 0;
      }

      .tabs {
        background: #ffffff;
        padding: 24px;
        border-radius: 12px;
        box-shadow: 0 4px 15px rgba(0, 0, 0, 0.05);
        width: 450px;
      }

      /* Added style for the widget header */
      .widget-header h2 {
        margin: 0 0 4px 0;
        font-size: 18px;
        color: #212529;
      }

      .widget-header p {
        margin: 0 0 16px 0;
        font-size: 13px;
        color: #6c757d;
      }

      .tab-headers {
        display: flex;
        gap: 8px;
        border-bottom: 2px solid #eef2f5;
        margin-bottom: 20px;
      }

      .tab {
        background: none;
        border: none;
        padding: 10px 18px;
        cursor: pointer;
        font-size: 15px;
        font-weight: 600;
        color: #6c757d;
        border-bottom: 3px solid transparent;
        transition: all 0.2s ease-in-out;
      }

      .tab:hover {
        color: #007bff;
      }

      .tab.active {
        color: #007bff;
        border-bottom-color: #007bff;
      }

      .content {
        display: none;
        padding: 10px 4px;
        font-size: 15px;
        color: #495057;
        line-height: 1.5;
      }

      .content.active {
        display: block;
      }
    </style>
  </head>
  <body>
    <div class="tabs">
      <!-- Added modern title header -->
      <div class="widget-header">
        <h2>Navigation Panel</h2>
        <p>Switch between views or use keys 1, 2, 3</p>
      </div>

      <div class="tab-headers">
        <button class="tab active" data-tab="1">Home</button>
        <button class="tab" data-tab="2">About</button>
        <button class="tab" data-tab="3">Contact</button>
      </div>
      <div class="tab-contents">
        <div class="content active" data-tab="1">Welcome to Home</div>
        <div class="content" data-tab="2">About us page here.</div>
        <div class="content" data-tab="3">Contact info displayed here.</div>
      </div>
    </div>
  </body>
</html>
